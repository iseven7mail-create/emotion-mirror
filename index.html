nput,select,textarea{display:block;width:100%;padding:9px;color:inherit;background:#fff;border:1px solid #b7a3bd;border-radius:9px}textarea{min-height:105px}article{margin-block:12px;padding:16px}article p{white-space:pre-wrap;overflow-wrap:anywhere}footer{font-size:.88rem;color:#615266}dialog{border:1px solid #d8c4df;border-radius:16px;background:#fff9f3;color:inherit;width:min(92vw,520px);max-height:90vh}dialog::backdrop{background:#302237bb}dialog img{display:block;max-width:100%;max-height:70vh;margin:auto}#library{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:9px}#library button{border-radius:12px;text-align:left}@media(max-width:640px){main{padding-block:28px}.grid,.result{grid-template-columns:1fr}.back{aspect-ratio:auto;min-height:106px}.card img{max-height:350px;object-fit:contain}.result img{max-height:420px;object-fit:contain}}

:root{color:#392e24;background:#f4e8d1;font-family:"Noto Serif TC","PMingLiU",serif}body{background:radial-gradient(ellipse at 85% 8%,#e4dbe6,transparent 46%),repeating-linear-gradient(27deg,#79532308 0 1px,transparent 1px 5px),#f5ead5}header{border-bottom:3px double #af8857;color:#593d26}main{padding-inline:clamp(14px,4vw,42px)}h1,h2{color:#593d26}h1{letter-spacing:.035em}.tag{color:#58603e}.role,.card,article,form,dialog{background:#fff7e7;border:1px solid #b58b57;box-shadow:inset 0 0 0 3px #fff7e7,inset 0 0 0 4px #d9bd91,0 4px 13px #6c4e3020}.role,.card{padding:14px}.role{color:#593d26}.role:hover,.card:focus-within{border-color:#76532c}.role img,.card img,.result img{border:1px solid #bd9d6f}button{background:#525a39;border-color:#525a39;color:#fff9e9}button.secondary{background:#fff4de;color:#593d26;border-color:#a08057}button:hover:not(:disabled){filter:brightness(.94)}button:focus-visible,a:focus-visible{outline-color:#725288}.back{border:5px double #dcbf85;background:radial-gradient(ellipse at center,#796a91,#463b5b);box-shadow:inset 0 0 0 6px #493d5d;color:#fff0c9}.back b{text-shadow:0 0 16px #ffdf9c}.card .image-button{border-radius:12px}input,select,textarea{background:#fffaf0;border-color:#a98a63}details summary,footer{color:#59482f}footer{border-top:3px double #af8857}header strong::after{content:" ❧";color:#666b44}article>strong{color:#593d26}@media(prefers-reduced-motion:no-preference){.role,.card{transition:box-shadow .18s ease}.role:hover{box-shadow:inset 0 0 0 3px #fff7e7,inset 0 0 0 4px #d9bd91,0 6px 18px #6c4e3033}}

</style><header><strong>✦ 情緒之鏡</strong><button class="secondary" id="diary">我的日記</button></header><main id="app" tabindex="-1"></main><footer><nav class="official" aria-label="少甫老師官方連結"><a href="https://line.me/R/ti/p/%40158vkyka" target="_blank" rel="noopener noreferrer">少甫老師官方 LINE ↗</a><a href="https://selfus.wordpress.com/" target="_blank" rel="noopener noreferrer">少甫室官方網站 ↗</a></nav>給 10–15 歲的情緒探索遊戲。日記只存在這個瀏覽器。<br>如果感受重到難以承受，可以找信任的大人陪你。</footer><dialog id="detail"><form method="dialog"><button>關閉</button></form><div id="detailBody"></div></dialog>
<script>
const names=["龍芽草","白楊","山毛櫸","矢車菊","紫金蓮","櫻桃李","栗樹芽苞","菊苣","鐵線蓮","野生酸蘋果","榆樹","龍膽","荊豆","石楠","冬青","忍冬","角樹","鳳仙花","落葉松","龍頭草","芥末","橡樹","橄欖","松樹","紅栗","岩薔薇","岩泉水","線球草","伯利恆之星","甜栗","馬鞭草","葡萄藤","胡桃","水堇","白栗","野燕麥","野玫瑰","柳樹"], feelings=["笑著藏住難過","說不出的不安","很難接受不同","不敢說不","不相信自己的選擇","怕情緒失控","反覆做了又後悔","希望關心有回報","一直想像以後","只看到自己的缺點","事情多到扛不住","遇到挫折就洩氣","覺得努力沒用","好想有人聽我說","嫉妒或猜疑","捨不得過去","還沒開始就累","等不及","怕自己比不上別人","害怕一件具體的事","說不上原因的難過","很累還在硬撐","真的沒力氣了","什麼都怪自己","擔心重要的人","突然好害怕","對自己要求太嚴","兩個選擇都想要","過去的難過又湧上來","此刻非常難受","很想說服別人","想替別人做決定","容易被外界影響","想靠近又想獨處","腦子一直在想","不知道往哪走","覺得怎樣都無所謂","覺得很不公平"], lines=["我可以說出真正的感受","我可以慢慢認識這份不安","我願意試著理解不同","我的意願也值得被尊重","我可以練習相信自己的選擇","情緒很強烈時我可以找人陪","我可以試試不同的做法","關心也能留給彼此空間","我可以從眼前的一小步開始","我不只是自己眼中的缺點","我可以分擔也可以求助","一次挫折不會抹去努力","我可以先接受一點陪伴","我值得被聽見也能慢慢等待","我可以承認嫉妒再說出需要","我能珍惜過去也靠近現在","我可以先做一件小事","我可以放慢速度聽聽別人","我不必先完美才開始","害怕時我可以一步一步來","我可以讓難過被看見","休息和求助也是勇氣","我需要時間慢慢恢復","我不必把所有責任都扛下","關心別人也照顧自己的不安","先踏穩雙腳讓人陪著我","我也值得休息和享受","我發現很多事只能負責的擇一","我發現過去難過的事又湧上來","此刻我是我這輩子最難受的時候","我可以聽聽別人意見","每個人的意願都值得尊重","好多外界事務一直影響我","有需要我就會出現","腦子停不下來一直在想","我可以透過嘗試認識方向","我不信宿命，我可以改變現況","我可以說出委屈再找下一步"];
const app=document.querySelector('#app'), detail=document.querySelector('#detail');
const key='emotion-mirror-diary-v1';
let edition='', hand=[], revealed=0, selected=null;
const cardPath=(i,deck=edition)=>deck+'-'+String(i+1).padStart(2,'0')+'.jpg';
function read(){try{const data=JSON.parse(localStorage.getItem(key)||'[]');return Array.isArray(data)?data:[]}catch{return []}}
function show(html){app.innerHTML=html;app.focus();window.scrollTo(0,0)}
function today(){return new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Taipei'}).format(new Date())}
function home(){show('<div class="book-cover" aria-hidden="true"></div><div class="tag">我的心情日記</div><h1>今天的我，<br>是什麼心情？</h1><p>選一個角色，翻開三張情緒牌。看看哪一張最像今天的你。</p><div class="roles">'+['boys','girls'].map((deck,i)=>'<button class="role" data-start="'+deck+'"><img alt="" src="'+cardPath(0,deck)+'"><span>'+['男孩版','女孩版'][i]+'</span></button>').join('')+'</div>')}
function start(deck){edition=deck;selected=null;revealed=0;const pool=names.map((_,i)=>i);hand=Array.from({length:3},()=>pool.splice(Math.floor(Math.random()*pool.length),1)[0]);draw()}
function draw(focus){app.innerHTML='<div class="tag">已翻開 '+revealed+' / 3</div><h1>翻開情緒牌</h1><p>依序翻開三張，選一張最像今天的你。</p><div class="grid">'+hand.map((i,p)=>p>=revealed?'<div class="card"><button class="back" data-flip="'+p+'" '+(p===revealed?'':'disabled')+'><b aria-hidden="true">✦</b>翻開第 '+(p+1)+' 張</button></div>':'<div class="card"><button class="image-button" aria-label="放大'+names[i]+'" data-image="'+i+'"><img alt="'+names[i]+'" src="'+cardPath(i)+'"></button><h2>'+names[i]+'</h2><p>'+feelings[i]+'</p><button class="secondary" data-text="'+i+'">閱讀文字版</button><button data-pick="'+i+'" '+(revealed<3?'disabled':'')+'>這張最像我</button></div>').join('')+'</div><div class="actions">'+(revealed===3?'<button class="secondary" data-library>都不太像，看看其他牌</button>':'')+'<button class="secondary" data-home>重新選角色</button></div>';if(focus){(app.querySelector('[data-flip]:not(:disabled)')||app.querySelector('[data-pick]'))?.focus()}else app.focus()}
function library(){show('<h1>找一張更像你的牌</h1><p>你也可以直接寫下自己的感受。</p><div id="library">'+names.map((n,i)=>'<button class="secondary" data-pick="'+i+'">'+n+'<br><small>'+feelings[i]+'</small></button>').join('')+'</div><div class="actions"><button data-write>直接寫日記</button><button class="secondary" data-draw>回到三張牌</button></div>')}
function pick(i){selected=i;show('<div class="result"><img alt="'+names[i]+'" src="'+cardPath(i)+'"><div><div class="tag">我今天選的牌</div><h1>'+names[i]+'</h1><p>'+feelings[i]+'</p><p>「'+lines[i]+'」</p><h2>這份感受想告訴你什麼？</h2><p>你可以想想它是什麼時候出現的，或今天希望誰陪陪你。</p><div class="actions"><button data-write>寫下今天</button><button class="secondary" data-draw>回到三張牌</button></div></div></div>')}
function write(){show('<div class="tag">每天留一點時間給自己</div><h1>我的心情日記</h1><form id="entry"><label>日期<input name="date" type="date" required value="'+today()+'"></label><label>這份感受有多強？<select name="level">'+['1｜一點點','2｜輕輕的','3｜感覺得到','4｜很明顯','5｜非常強烈'].map((x,i)=>'<option value="'+(i+1)+'" '+(i===2?'selected':'')+'>'+x+'</option>').join('')+'</select></label>'+(selected!==null?'<p>今天的牌：'+names[selected]+'</p>':'')+'<label>想留下一句話嗎？（可略過）<textarea name="note" maxlength="1000" placeholder="今天，我注意到……"></textarea></label><button>儲存日記</button><p id="status" role="status"></p></form><div class="actions"><button class="secondary" data-home>回到首頁</button></div><h2>以前的心情</h2><div id="entries"></div>');historyList()}
function historyList(){
 const box=document.querySelector('#entries'), records=read();
 const ordered=records.map((row,index)=>({row,index})).sort((a,b)=>b.row.date.localeCompare(a.row.date));
 if(!ordered.length){box.textContent='還沒有日記。';return}
 for(const {row,index} of ordered){
  const item=document.createElement('article'), title=document.createElement('strong'), note=document.createElement('p');
  title.textContent=row.date+(row.mood?' · '+row.mood:'')+' · '+row.level+'/5'+(row.card?' · '+row.card:'');
  note.textContent=row.note;
  const follow=document.createElement('details');
  follow.innerHTML='<summary>回頭看看</summary><form class="reflection"><label>跟寫日記的時候比，現在感覺怎麼樣？<select name="change" required><option value="">請選一個</option><option>好一些了</option><option>差不多</option><option>更難受了</option><option>有變化，但還說不上來</option></select></label><label>我發現了什麼？下次想試著調整什麼？（可略過）<textarea name="thought" maxlength="1000" placeholder="我發現……下次我想試試……"></textarea></label><button>儲存回顧</button><p role="status"></p></form>';
  const form=follow.querySelector('form'), status=form.querySelector('[role="status"]');
  if(row.reflection){form.elements.change.value=row.reflection.change;form.elements.thought.value=row.reflection.thought;status.textContent='上次回顧：'+row.reflection.date;follow.open=true}
  form.addEventListener('submit',event=>{
   event.preventDefault();
   const latest=read(), current=latest[index];
   if(!current||JSON.stringify(current)!==JSON.stringify(row)){status.textContent='紀錄已更新，請重新開啟日記再試。';return}
   const reflection={...Object.fromEntries(new FormData(form)),date:today()};
   try{
    latest[index]={...current,reflection};
    localStorage.setItem(key,JSON.stringify(latest));
    row.reflection=reflection;
    status.textContent='已儲存回顧 · '+reflection.date;
   }catch{status.textContent='這個瀏覽器目前無法儲存回顧。'}
  });
  item.append(title,note,follow);box.append(item);
 }
}
document.querySelector('#diary').onclick=()=>{selected=null;write()};
app.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;if(d.start)start(d.start);else if('flip'in d){revealed++;draw(true)}else if('pick'in d)pick(Number(d.pick));else if('home'in d)home();else if('write'in d)write();else if('library'in d)library();else if('draw'in d)draw();else if('image'in d||'text'in d){const i=Number(d.image??d.text);document.querySelector('#detailBody').innerHTML='image'in d?'<img src="'+cardPath(i)+'" alt="'+names[i]+'">':'<h2>'+names[i]+'</h2><p>'+feelings[i]+'</p><p>'+lines[i]+'</p>';detail.showModal()}});
app.addEventListener('submit',e=>{if(e.target.id!=='entry')return;e.preventDefault();const data=Object.fromEntries(new FormData(e.target));try{localStorage.setItem(key,JSON.stringify([...read(),{...data,card:selected===null?'':names[selected]}]));e.target.reset();document.querySelector('#entries').replaceChildren();historyList();document.querySelector('#status').textContent='已儲存。'}catch{document.querySelector('#status').textContent='這個瀏覽器目前無法儲存日記。'}});
home();
</script></html>
